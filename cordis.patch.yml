# channel-guard bundle patch
#
# 用 `- insert:` 新增 loader 行，避免顶层 id-target 覆盖在单独装载时报
# `patch: entry "channel-guard" not found`。
- insert:
    - id: channel-guard
      name: 'channel-guard'
      config:
        # 第 1 层：按内容改写 system 文本指纹（不依赖 provider，零风险）
        buddySystem: true
        # 第 2 层：fetch 层修正 codearts 请求（UA 改写 + 去 benefit 头 + 重签名）
        codeartsFetch: true
        # 第 3 层：诊断服务
        diagnose: true
        # 打开后会把每次改写写进日志，排查时用
        debug: false
